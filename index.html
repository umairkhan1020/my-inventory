            <div class="form-group"><label>Owner PIN</label><input type="password" id="pinOwnerInput" class="form-control"></div>
            <div class="form-group"><label>Store Manager PIN</label><input type="password" id="pinStoreInput" class="form-control"></div>
            <div class="form-group"><label>Branch 1 PIN</label><input type="password" id="pinB1Input" class="form-control"></div>
            <div class="form-group"><label>Branch 2 PIN</label><input type="password" id="pinB2Input" class="form-control"></div>
            <button class="btn btn-green" onclick="savePINs()"><i class="fas fa-key"></i> Save PINs</button>
        </div>
    </div>

    <!-- OWNER EDIT MODAL -->
    <div class="modal" id="ownerEditModal">
        <div class="modal-content">
            <div class="panel-title"><i class="fas fa-edit"></i> Owner Direct Stock Edit</div>
            <p id="editItemTitle" style="font-weight: bold; margin-bottom: 10px; color: var(--accent-teal);"></p>
            <input type="hidden" id="editItemId">
            <div class="form-group"><label>Warehouse Qty</label><input type="number" id="editWhQty" class="form-control"></div>
            <div class="form-group"><label>Branch 1 Qty</label><input type="number" id="editB1Qty" class="form-control"></div>
            <div class="form-group"><label>Branch 2 Qty</label><input type="number" id="editB2Qty" class="form-control"></div>
            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button class="btn btn-green" style="flex:1;" onclick="saveOwnerStockEdit()">Save Changes</button>
                <button class="btn btn-red" onclick="deleteItemByOwner()"><i class="fas fa-trash"></i> Delete Item</button>
            </div>
        </div>
    </div>

    <!-- SECURITY LOCK OVERLAY MODAL -->
    <div class="modal active" id="mainPinLockScreen" style="z-index: 9999; background: rgba(0,0,0,0.95);">
        <div class="modal-content" style="text-align: center;">
            <div style="font-size: 36px; color: var(--accent-teal); margin-bottom: 8px;"><i class="fas fa-shield-alt"></i></div>
            <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 4px;">Ibn E Rahat Enterprise</h2>
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 16px;">System Locked. Enter PIN Code to continue.</p>
            
            <div class="form-group" style="text-align: left;">
                <label>Select Account Role</label>
                <select id="lockRoleSelect" class="form-control">
                    <option value="OWNER">👑 Owner Account</option>
                    <option value="STORE_MANAGER">🏬 Store / Warehouse Manager</option>
                    <option value="BRANCH_1">🍕 Branch 1 Manager</option>
                    <option value="BRANCH_2">🍔 Branch 2 Manager</option>
                </select>
            </div>

            <div class="form-group" style="text-align: left;">
                <label>Enter 4-Digit Security PIN</label>
                <input type="password" id="lockPinInput" maxlength="4" class="form-control" placeholder="••••" style="font-size: 20px; letter-spacing: 5px; text-align: center;">
            </div>

            <button class="btn btn-green" style="width: 100%; justify-content: center; padding: 10px;" onclick="unlockAppSystem()">
                <i class="fas fa-lock-open"></i> Unlock Dashboard
            </button>
            <p id="lockErrorMsg" style="color: var(--accent-red); font-size: 11px; margin-top: 10px; display: none;">❌ Incorrect Security PIN Code!</p>
        </div>
    </div>

    <script>
        let accountPins = JSON.parse(localStorage.getItem('ibn_pins')) || { 'OWNER': '0000', 'STORE_MANAGER': '1111', 'BRANCH_1': '2222', 'BRANCH_2': '3333' };
        let currentRole = null;
        let currentFilter = 'ALL';

        let stockData = JSON.parse(localStorage.getItem('ibn_stock')) || [
            { id: 1, name: 'Black olive', cat: 'INGREDIENT', alertLevel: 5, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 2, name: 'Chicken powder', cat: 'INGREDIENT', alertLevel: 5, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 3, name: 'Chili garlic', cat: 'SAUCE', alertLevel: 5, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 4, name: 'Chowmin masla', cat: 'INGREDIENT', alertLevel: 5, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 5, name: 'Forks 🍴', cat: 'PACKAGING', alertLevel: 20, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 6, name: 'ketchup sashy', cat: 'PACKAGING', alertLevel: 50, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 7, name: 'Khaki', cat: 'PACKAGING', alertLevel: 10, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 8, name: 'M.pack 750ml', cat: 'PACKAGING', alertLevel: 15, warehouse: 0, dispatched: 0, b1: 0, b2: 0 },
            { id: 9, name: 'Oil tem', cat: 'INGREDIENT', alertLevel: 5, warehouse: 0, dispatched: 0, b1: 0, b2: 0 }
        ];

        let ledgerData = JSON.parse(localStorage.getItem('ibn_ledger')) || [];

        function unlockAppSystem() {
            const role = document.getElementById('lockRoleSelect').value;
            const pin = document.getElementById('lockPinInput').value.trim();
            const errorMsg = document.getElementById('lockErrorMsg');

            if (pin === (accountPins[role] || '0000')) {
                currentRole = role;
                document.getElementById('mainPinLockScreen').classList.remove('active');
                document.getElementById('lockPinInput').value = '';
                errorMsg.style.display = 'none';
                applyRolePermissions();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function openLoginModal() {
            document.getElementById('mainPinLockScreen').classList.add('active');
        }

        function saveData() {
            localStorage.setItem('ibn_stock', JSON.stringify(stockData));
            localStorage.setItem('ibn_ledger', JSON.stringify(ledgerData));
            localStorage.setItem('ibn_pins', JSON.stringify(accountPins));
            updateKPIs();
        }

        function applyRolePermissions() {
            document.getElementById('currentRoleBadgeLabel').innerText = currentRole.replace('_', ' ');

            const isOwner = currentRole === 'OWNER';
            const isStore = currentRole === 'STORE_MANAGER' || isOwner;
            const isB1 = currentRole === 'BRANCH_1';
            const isB2 = currentRole === 'BRANCH_2';

            document.getElementById('menu-add-item').style.display = isStore ? 'block' : 'none';
            document.getElementById('menu-store-demand').style.display = isStore ? 'block' : 'none';
            document.getElementById('menu-dispatch').style.display = isStore ? 'block' : 'none';
            document.getElementById('menu-branch-req').style.display = (isB1 || isB2) ? 'block' : 'none';
            document.getElementById('menu-owner-report').style.display = isOwner ? 'block' : 'none';

            document.getElementById('thB1').style.display = (isB2) ? 'none' : 'table-cell';
            document.getElementById('thB2').style.display = (isB1) ? 'none' : 'table-cell';
            document.getElementById('thWh').style.display = (isB1 || isB2) ? 'none' : 'table-cell';
            document.getElementById('thAction').style.display = isOwner ? 'table-cell' : 'none';

            renderStockTable();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderStockTable();
        }

        function switchView(viewId) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            toggleSidebar();

            if (viewId === 'dashboardView') renderStockTable();
            if (viewId === 'storeDemandView') renderStoreDemandGrid();
            if (viewId === 'dispatchView') renderFastDispatchGrid();
            if (viewId === 'branchReqView') renderBranchReqGrid();
            if (viewId === 'ownerReportView') renderOwnerReport();
            if (viewId === 'ledgerView') renderLedger();
            if (viewId === 'wasteView') populateWasteItems();
        }

        function updateKPIs() {
            document.getElementById('kpiTotal').innerText = stockData.length;
            let lowCount = stockData.filter(i => i.warehouse <= (i.alertLevel || 5)).length;
            document.getElementById('kpiLowStock').innerText = lowCount;
            document.getElementById('kpiDispatched').innerText = stockData.reduce((a, b) => a + (b.dispatched || 0), 0);
        }

        function renderStockTable() {
            const tbody = document.getElementById('stockTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            stockData.forEach(item => {
                if (currentFilter === 'LOW' && item.warehouse > (item.alertLevel || 5)) return;
                if (currentFilter !== 'ALL' && currentFilter !== 'LOW' && item.cat !== currentFilter) return;
                if (searchVal && !item.name.toLowerCase().includes(searchVal)) return;

                const tr = document.createElement('tr');
                let whCol = (currentRole === 'BRANCH_1' || currentRole === 'BRANCH_2') ? '' : `<td>${item.warehouse}</td>`;
                let b1Col = (currentRole === 'BRANCH_2') ? '' : `<td>${item.b1}</td>`;
                let b2Col = (currentRole === 'BRANCH_1') ? '' : `<td>${item.b2}</td>`;
                let actionCol = (currentRole === 'OWNER') ? `<td><button class="btn btn-blue" style="padding:3px 6px; font-size:10px;" onclick="openOwnerEditModal(${item.id})"><i class="fas fa-edit"></i></button></td>` : '';

                tr.innerHTML = `
                    <td>
                        <div class="item-name-cell">
                            <strong>${item.name}</strong>
                            <span class="cat-badge">${item.cat || 'ITEM'}</span>
                        </div>
                    </td>
                    ${whCol}
                    <td style="color: var(--accent-orange); font-weight: bold;">${item.dispatched}</td>
                    ${b1Col}
                    ${b2Col}
                    ${actionCol}
                `;
                tbody.appendChild(tr);
            });
            updateKPIs();
        }

        function openOwnerEditModal(id) {
            const item = stockData.find(x => x.id === id);
            if (!item) return;

            document.getElementById('editItemId').value = item.id;
            document.getElementById('editItemTitle').innerText = item.name;
            document.getElementById('editWhQty').value = item.warehouse;
            document.getElementById('editB1Qty').value = item.b1;
            document.getElementById('editB2Qty').value = item.b2;
            document.getElementById('ownerEditModal').classList.add('active');
        }

        function saveOwnerStockEdit() {
            const id = parseInt(document.getElementById('editItemId').value);
            const item = stockData.find(x => x.id === id);
            if (item) {
                item.warehouse = parseInt(document.getElementById('editWhQty').value) || 0;
                item.b1 = parseInt(document.getElementById('editB1Qty').value) || 0;
                item.b2 = parseInt(document.getElementById('editB2Qty').value) || 0;
                saveData();
                document.getElementById('ownerEditModal').classList.remove('active');
                renderStockTable();
            }
        }

        function deleteItemByOwner() {
            const id = parseInt(document.getElementById('editItemId').value);
            if (confirm("Item delete karna chahte hain?")) {
                stockData = stockData.filter(x => x.id !== id);
                saveData();
                document.getElementById('ownerEditModal').classList.remove('active');
                renderStockTable();
            }
        }

        function addNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const cat = document.getElementById('newItemCat').value;
            const alertLevel = parseInt(document.getElementById('newItemAlertLevel').value) || 5;
            const qty = parseInt(document.getElementById('newItemQty').value) || 0;

            if (!name) return alert("Item name likhein!");

            const newId = stockData.length > 0 ? Math.max(...stockData.map(i => i.id)) + 1 : 1;
            stockData.push({ id: newId, name: name, cat: cat, alertLevel: alertLevel, warehouse: qty, dispatched: 0, b1: 0, b2: 0 });

            saveData();
            alert(`Naya item "${name}" add ho gaya!`);
            document.getElementById('newItemName').value = '';
            switchView('dashboardView');
        }

        function renderStoreDemandGrid() {
            const tbody = document.getElementById('storeDemandTableBody');
            tbody.innerHTML = '';
            stockData.forEach(i => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${i.name}</strong><br><span class="cat-badge">${i.cat}</span></td>
                        <td>${i.warehouse}</td>
                        <td><input type="number" class="qty-input store-demand-input" data-id="${i.id}" value="0" min="0"></td>
                    </tr>`;
            });
        }

        function saveStoreDemand() {
            document.querySelectorAll('.store-demand-input').forEach(input => {
                const id = parseInt(input.getAttribute('data-id'));
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    const item = stockData.find(x => x.id === id);
                    if (item) {
                        item.warehouse += qty;
                        ledgerData.unshift({ date: new Date().toLocaleString(), item: item.name, qty: qty, branch: 'Store Warehouse', type: 'PURCHASE' });
                    }
                }
            });
            saveData();
            switchView('dashboardView');
        }

        function renderFastDispatchGrid() {
            const tbody = document.getElementById('fastDispatchTableBody');
            tbody.innerHTML = '';
            stockData.forEach(i => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${i.name}</strong></td>
                        <td>${i.warehouse}</td>
                        <td><input type="number" class="qty-input fast-dispatch-input" data-id="${i.id}" value="0" min="0"></td>
                    </tr>`;
            });
        }

        function processFastDispatch() {
            const target = document.getElementById('fastDispatchTarget').value;
            document.querySelectorAll('.fast-dispatch-input').forEach(input => {
                const id = parseInt(input.getAttribute('data-id'));
                const qty = parseInt(input.value) || 0;
                const item = stockData.find(x => x.id === id);
                if (qty > 0 && item && qty <= item.warehouse) {
                    item.warehouse -= qty;
                    item.dispatched += qty;
                    if (target === 'BRANCH 1') item.b1 += qty;
                    if (target === 'BRANCH 2') item.b2 += qty;
                    ledgerData.unshift({ date: new Date().toLocaleString(), item: item.name, qty: qty, branch: target, type: 'DISPATCH' });
                }
            });
            saveData();
            switchView('dashboardView');
        }

        function renderBranchReqGrid() {
            const tbody = document.getElementById('branchReqTableBody');
            tbody.innerHTML = '';
            stockData.forEach(i => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${i.name}</strong></td>
                        <td><input type="number" class="qty-input branch-req-input" data-id="${i.id}" value="0" min="0"></td>
                    </tr>`;
            });
        }

        function sendBranchRequest() {
            alert("Branch request sent to main store!");
            switchView('dashboardView');
        }

        function renderOwnerReport() {
            document.getElementById('repWeeklyDemand').innerText = ledgerData.filter(l => l.type === 'PURCHASE').reduce((a, b) => a + b.qty, 0);
            document.getElementById('repSentB1').innerText = ledgerData.filter(l => l.branch === 'BRANCH 1').reduce((a, b) => a + b.qty, 0);
            document.getElementById('repSentB2').innerText = ledgerData.filter(l => l.branch === 'BRANCH 2').reduce((a, b) => a + b.qty, 0);
        }

        function renderLedger() {
            const tbody = document.getElementById('ledgerTableBody');
            tbody.innerHTML = '';
            ledgerData.forEach(l => {
                tbody.innerHTML += `<tr><td>${l.date}</td><td>${l.item}</td><td>${l.qty}</td><td>${l.branch}</td><td>${l.type}</td></tr>`;
            });
        }

        function populateWasteItems() {
            const select = document.getElementById('wasteItem');
            select.innerHTML = '';
            stockData.forEach(i => select.innerHTML += `<option value="${i.id}">${i.name}</option>`);
        }

        function processDeduction() {
            const id = parseInt(document.getElementById('wasteItem').value);
            const qty = parseInt(document.getElementById('wasteQty').value) || 0;
            const item = stockData.find(x => x.id === id);
            if (item && qty > 0) {
                if (currentRole === 'BRANCH_1') item.b1 = Math.max(0, item.b1 - qty);
                else if (currentRole === 'BRANCH_2') item.b2 = Math.max(0, item.b2 - qty);
                else item.warehouse = Math.max(0, item.warehouse - qty);
                saveData();
                switchView('dashboardView');
            }
        }

        function shareWhatsApp() {
            let text = "📦 *Ibn E Rahat Enterprise - Stock Summary*\n\n";
            stockData.forEach(i => text += `• *${i.name}*: Warehouse: ${i.warehouse} | B1: ${i.b1} | B2: ${i.b2}\n`);
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function exportExcel() {
            let csv = "Item Name,Category,Warehouse,Dispatched Today,Branch 1,Branch 2\n";
            stockData.forEach(i => csv += `"${i.name}","${i.cat}",${i.warehouse},${i.dispatched},${i.b1},${i.b2}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Stock_Report.csv`;
            a.click();
        }

        function savePINs() {
            accountPins['OWNER'] = document.getElementById('pinOwnerInput').value.trim() || accountPins['OWNER'];
            accountPins['STORE_MANAGER'] = document.getElementById('pinStoreInput').value.trim() || accountPins['STORE_MANAGER'];
            accountPins['BRANCH_1'] = document.getElementById('pinB1Input').value.trim() || accountPins['BRANCH_1'];
            accountPins['BRANCH_2'] = document.getElementById('pinB2Input').value.trim() || accountPins['BRANCH_2'];
            saveData();
            alert("Security PINs Updated!");
        }
    </script>
</body>
</html>
